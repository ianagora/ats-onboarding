{% extends "base.html" %}

{% block title %}Two-Factor Authentication{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md mt-16">
    <div class="text-center mb-6">
        <i class="fas fa-shield-alt text-5xl text-blue-600 mb-4"></i>
        <h1 class="text-2xl font-bold">Two-Factor Authentication</h1>
        <p class="text-gray-600 mt-2">Enter the 6-digit code from your authenticator app</p>
    </div>

    <form method="POST" id="verify-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <input type="hidden" name="use_backup" id="use_backup" value="0"/>
        
        <div class="mb-6">
            <input 
                type="text" 
                name="token" 
                id="token-input"
                placeholder="000000"
                pattern="[0-9]{6}"
                maxlength="6"
                class="w-full px-4 py-3 text-2xl text-center font-mono border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
                autofocus
            />
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded">
            <i class="fas fa-check mr-2"></i>
            Verify
        </button>
    </form>

    <div class="mt-6 text-center">
        <button 
            onclick="toggleBackupMode()"
            class="text-sm text-blue-600 hover:text-blue-800"
        >
            <i class="fas fa-key mr-1"></i>
            Use backup code instead
        </button>
    </div>

    <div class="mt-4 text-center">
        <a href="{{ url_for('login') }}" class="text-sm text-gray-600 hover:text-gray-800">
            <i class="fas fa-arrow-left mr-1"></i>
            Back to login
        </a>
    </div>

    <div class="mt-6 bg-blue-50 border-l-4 border-blue-500 p-4">
        <p class="text-sm text-blue-700">
            <i class="fas fa-info-circle mr-2"></i>
            <strong>Lost your phone?</strong> Use a backup code to access your account.
        </p>
    </div>
</div>

<script>
function toggleBackupMode() {
    const useBackup = document.getElementById('use_backup');
    const tokenInput = document.getElementById('token-input');
    
    if (useBackup.value === '0') {
        // Switch to backup code mode
        useBackup.value = '1';
        tokenInput.placeholder = 'XXXXXXXX';
        tokenInput.pattern = '[A-Fa-f0-9]{8}';
        tokenInput.maxLength = 8;
        tokenInput.value = '';
        tokenInput.focus();
    } else {
        // Switch back to TOTP mode
        useBackup.value = '0';
        tokenInput.placeholder = '000000';
        tokenInput.pattern = '[0-9]{6}';
        tokenInput.maxLength = 6;
        tokenInput.value = '';
        tokenInput.focus();
    }
}
</script>
{% endblock %}
